<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3e8">
<title>内耗类型测试 · 你是哪一种</title>
<style>
  :root{--ink:#14161a;--cream:#f7f3e8;--yellow:#ffd60a;--gray:#8a8780;--line:#e6e0d0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  .wrap{flex:1;display:flex;flex-direction:column;padding:24px 22px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;width:100%}
  .hide{display:none!important}
  #cover{justify-content:center}
  #cover .kicker{font-size:13px;letter-spacing:.22em;color:var(--gray);margin-bottom:18px}
  #cover h1{font-size:40px;line-height:1.18;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
  #cover h1 em{font-style:normal;background:linear-gradient(transparent 62%, var(--yellow) 62%)}
  #cover .sub{font-size:15px;color:#4a4740;line-height:1.7;margin:18px 0 26px}
  #cover .meta{font-size:13px;color:var(--gray);margin-bottom:22px;line-height:1.7}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:700;background:var(--ink);color:var(--cream);cursor:pointer}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 26px}
  .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .28s ease}
  .qno{font-size:13px;color:var(--gray);letter-spacing:.12em;margin-bottom:14px}
  .qtext{font-size:23px;line-height:1.5;font-weight:700;margin:0 0 26px;letter-spacing:-.2px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{border:1.5px solid var(--line);background:#fffdf6;border-radius:14px;padding:16px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
  .opt:active{background:var(--yellow);border-color:var(--ink)}
  .opt b{display:block;font-size:16px}
  .back{margin-top:auto;padding-top:20px;font-size:14px;color:var(--gray);background:none;border:none;cursor:pointer;text-align:left}

  .rtype{font-size:13px;letter-spacing:.22em;color:var(--gray);margin-bottom:10px}
  .rname{font-size:44px;font-weight:800;line-height:1.1;margin:0 0 6px;letter-spacing:-1px}
  .rname em{font-style:normal;background:linear-gradient(transparent 62%, var(--yellow) 62%)}
  .rsub{font-size:16px;color:#4a4740;margin:0 0 6px;line-height:1.6}
  .bar2{font-size:13px;color:var(--gray);margin:0 0 22px}
  .card{background:#fffdf6;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;color:var(--gray);font-weight:700}
  .card p{margin:0 0 9px;font-size:15.5px;line-height:1.7}
  .card p:last-child{margin-bottom:0}
  .card ul{margin:0;padding-left:18px}
  .card li{font-size:15.5px;line-height:1.7;margin-bottom:7px}
  .card li:last-child{margin-bottom:0}
  .card.hl{background:var(--yellow);border:none}
  .card.hl h3{color:#6b5b00}
  .card.good{border-color:#cfe3c4;background:#f4faf0}
  .quote{font-size:16px;font-weight:700;margin:0 0 8px}
  .secondary{font-size:14px;color:var(--gray);margin:2px 0 18px;line-height:1.6}
  .disclaimer{font-size:12px;color:var(--gray);line-height:1.7;margin:8px 0 22px;padding-top:14px;border-top:1px solid var(--line)}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  .dim{margin-bottom:14px}
  .dim:last-child{margin-bottom:0}
  .dim .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:var(--ink)}
  .dim .top span{color:var(--gray);font-size:13px}
  .dim .track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .dim .fill{height:100%;background:#c9c3b4;border-radius:99px;transition:width .4s ease}
  .dim.top1 .fill{background:var(--ink)}
  @media (max-width:360px){#cover h1{font-size:34px}.qtext{font-size:20px}.rname{font-size:36px}}
</style>
</head>
<body>
<div class="wrap" id="cover">
  <div class="kicker">24 题 · 约 4 分钟</div>
  <h1>你的内耗<br>到底是<em>哪一种</em></h1>
  <p class="sub">不是「你有多严重」。<br>是你在用哪种方式消耗自己。</p>
  <div class="meta">4 种类型 · 主型 + 副型 + 强度<br>每种都给你能立刻做的一步</div>
  <button class="btn" onclick="start()">开始测试</button>
</div>

<div class="wrap hide" id="quiz">
  <div class="bar"><i id="prog"></i></div>
  <div class="qno" id="qno"></div>
  <h2 class="qtext" id="qtext"></h2>
  <div class="opts" id="opts"></div>
  <button class="back" id="back" onclick="prev()">← 上一题</button>
</div>

<div class="wrap hide" id="result">
  <div class="rtype">你的主型</div>
  <h1 class="rname"><em id="rname"></em></h1>
  <p class="rsub" id="rsub"></p>
  <p class="bar2" id="rlevel"></p>

  <div class="card"><h3>你的四维分布</h3><div id="dims"></div></div>

  <div class="card"><h3>听起来像不像你</h3><ul id="scenes"></ul></div>
  <div class="card"><h3>它为什么会停不下来</h3><p id="mechanism"></p></div>
  <div class="card good"><h3>它其实也是你的长处</h3><p id="strength"></p></div>
  <div class="card hl"><h3>今天就能做的一步</h3><p id="action"></p></div>
  <div class="card"><h3>接下来 7 天</h3><ul id="practice"></ul></div>
  <div class="card"><h3>别再对自己说</h3><p class="quote" id="stopword"></p><p id="reply"></p></div>

  <div id="second-block" class="hide">
    <div class="secondary" id="rsecond"></div>
    <div class="card"><h3>你的副型 · 它会怎么叠加</h3><p id="secondDetail"></p></div>
  </div>

  <div class="disclaimer">
    这是一份自我觉察工具，不是诊断，不能替代专业帮助。<br>
    如果持续两周以上影响睡眠、食欲或工作，请去看医生或心理咨询师。
  </div>

  <div class="row">
    <button class="btn ghost" onclick="restart()">再测一次</button>
    <button class="btn" onclick="share()">保存结果卡</button>
  </div>
</div>

<script>
var LIK = ['完全不像我','不太像','有一点像','比较像','非常像我'];

var BASE = [
  ['A','白天说错一句话，晚上躺下还会重播那个画面。'],
  ['B','事情还没发生，我已经在脑子里演了几种最坏的结果。'],
  ['C','看到同龄人进展比我快，我会立刻觉得自己的努力没有意义。'],
  ['D','别人态度有一点变化，我就会分析是不是自己哪里做错了。'],
  ['A','会反复回想几个月前的一次尴尬，而且每次都觉得更难堪。'],
  ['B','要做一件没做过的事，我会先把所有可能出错的地方想一遍。'],
  ['C','我会下意识算：他做这件事用了多久，我用了多久。'],
  ['D','我常常想搞清楚「他当时那句话到底是什么意思」。'],
  ['A','和人聊完天，会回放自己说过的每句话，检查有没有说错。'],
  ['B','别人说「明天找你聊一下」，我当晚就会睡不好。'],
  ['C','刷到别人的成果，我会马上反观自己「我是不是浪费了时间」。'],
  ['D','一段关系里出现冷淡，我会一直找原因，直到找到为止。'],
  ['A','一件事已经过去了，我还在想「当时要是……就好了」。'],
  ['B','我会为一个大概率不会发生的风险，提前准备很久。'],
  ['C','我做一件事的满足感，很大程度取决于别人怎么看。'],
  ['D','我会反复推演别人的动机，即使对方已经说清楚了。'],
  ['A','别人一句没头没尾的话，我会在心里放很久。'],
  ['B','一旦某件事没有明确答案，我就没法安心做别的。'],
  ['C','有人比我做得好，我会替自己难堪，即使那件事跟我无关。'],
  ['D','我很难接受「不知道他为什么这样」，会一直想。'],
  ['A','手机相册翻到旧照片，会顺着那段回忆一路想下去，停不下来。'],
  ['B','出门前会在脑子里把整个流程走一遍，包括可能出的岔子。'],
  ['C','发完朋友圈会忍不住看别人的，比较谁的生活更像样。'],
  ['D','对方回复变短了，我会回想自己上一句是不是说错了什么。']
];

var TYPES = {
  A:{
    name:'回放机',
    sub:'昨天那句话，你今天还在想。',
    scenes:[
      '躺下就开始重播白天的对话，越想越清醒',
      '翻出几个月前的尴尬，每次想起都更难堪',
      '聊完天逐句检查自己有没有说错',
      '别人一句没头没尾的话，你能在心里放好几天'
    ],
    mechanism:'大脑把「重播」当成了「处理」。它默认再想一遍就能找到某个答案——可那件事根本没有答案，所以永远播不完。你不是放不下，是你的脑子还在等一个「说清楚了」的信号。',
    strength:'你对细节和他人情绪的记忆力很强。同一件事，你能看到别人漏掉的那一层。这种复盘能力用对地方，就是洞察力。',
    action:'给回放设一个时间盒：每天固定 10 分钟「专门想」，其余时间想起来就记一行字，攒到那 10 分钟再想。',
    practice:[
      '每天 10 分钟「专门想」时段，手机计时，到点就停',
      '给那段反复回放的记忆写一句「结案陈词」，写完不再改',
      '下次开始回放时问自己：这次我想找的是什么答案？通常答不出来，那就是信号'
    ],
    stop:'我怎么还在想这件事。',
    reply:'想，不代表你没出息。回放是大脑在试图修正，它只是还没找到出口。',
    second:'两种类型叠在一起时，常见的是白天预演、晚上回放——白天先把坏的想一遍，晚上再把说过的重播一遍。'
  },
  B:{
    name:'灾难导演',
    sub:'事情还没发生，你已经演了十遍最坏。',
    scenes:[
      '一句话约谈，你当晚就睡不着',
      '先想尽所有可能出错的地方，才敢动手',
      '没有明确答案的时候，没法安心做别的事',
      '为一个大概率不会发生的风险，提前准备很久'
    ],
    mechanism:'担忧是一种「廉价的准备」。在脑子里演一遍最坏，会让你产生「我已经应对过了」的错觉——但它不产生任何可执行的动作，所以只能一遍遍重演。',
    strength:'你预判风险的能力比多数人强。别人觉得「应该没事」的地方，你能提前看到坑。这种敏感在一个靠谱的团队里非常值钱。',
    action:'把最坏的结果写下来，再写一句「如果真发生，我第一步做什么」。预演停不下来，是因为它没有落点。',
    practice:[
      '写下最坏结果 + 你的第一步动作，三行就够',
      '把担忧分成两栏：我能做的 / 我不能做的，只看第一栏',
      '给每个担心的假设一个「决定日期」，在那天之前不再想它'
    ],
    stop:'我就是想太多。',
    reply:'你不是想太多，你是在用想象代替准备。想象给不了答案，落点才能。',
    second:'两种类型叠在一起时，最容易变成焦虑闭环：预演出坏结果，再回放找自己的错。这时候先落地一个动作，比想清楚更重要。'
  },
  C:{
    name:'参照系',
    sub:'别人的进度条，是你的刑具。',
    scenes:[
      '看到同龄人更快，立刻觉得自己在浪费生命',
      '下意识算时差：他用了多久，我用了多久',
      '成果的满足感，很大程度取决于别人怎么看',
      '有人比你做得好就替自己难堪，即使跟你无关'
    ],
    mechanism:'比较的痛不在于差距，而在于信息不对等——你拿自己的全过程，去对别人剪好的高光片段。这场比较从规则上就是输的。',
    strength:'你一直看着别人，说明你有很强的方向感和上进心。真正躺平的人不会比较。',
    action:'把「他在哪」换成「我比三个月前的自己多会了什么」。只写一条，写完就关掉手机。',
    practice:[
      '每天写一条「我今天具体做到了什么」，要具体到动作',
      '取关或静音三个让你反复比较的账号，不是绝交，是减少曝光',
      '每周比一次：上周的我 vs 这周的我，只跟自己比'
    ],
    stop:'我这算什么。',
    reply:'比较之所以疼，是因为你拿自己的幕后，去对别人的高光。',
    second:'两种类型叠在一起时，会变成比较完再回放：先被别人的进度刺痛，然后反复回想自己哪里不如。这时候切断信息源，比调整心态更快。'
  },
  D:{
    name:'显微镜',
    sub:'你总在分析他为什么那样对我。',
    scenes:[
      '对方态度一变，先自查是不是自己的错',
      '追着那句暧昧的话想它到底什么意思',
      '关系一冷淡就必须找到原因才罢休',
      '对方已经说清楚了，还在推演他真正的动机'
    ],
    mechanism:'你在用「推理」替代「询问」。推理看起来更安全——不用承担被拒绝、被敷衍的风险。但它得出的结论，没有一个是经过验证的。',
    strength:'你对关系的变化极其敏锐，能提前察觉别人的情绪。这种敏感让你成为一个很会照顾人的人。',
    action:'允许一件事暂时没有解释。写下「我不知道，先这样」，然后去做一件别的事——找解释的冲动一般 20 分钟内会降下去。',
    practice:[
      '遇事先真的问出口一句「是我多想了吗」，而不是自己推演',
      '拿张纸分两栏：事实 / 我的解释，只认可第一栏',
      '练习一次不追问：把想问的话先写下来，放一晚再决定问不问'
    ],
    stop:'我是不是太敏感。',
    reply:'你在意关系，才会去读它。敏感不是毛病，是分辨率高——但不需要每张图都放大到像素。',
    second:'两种类型叠在一起时，最常见的是分析完再回放：先推演他什么意思，再把你们的对话反复过一遍。这时候直接问一句，比想一晚更省力。'
  }
};

var ITEMS = [], idx = 0, answers = [], lastResult = null;
function $(id){ return document.getElementById(id); }
function show(id){ ['cover','quiz','result'].forEach(function(x){ $(x).classList.toggle('hide', x !== id); }); }

function shuffle(a){
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function start(){
  ITEMS = shuffle(BASE);
  idx = 0;
  answers = new Array(ITEMS.length);
  for (var i = 0; i < answers.length; i++) answers[i] = null;
  show('quiz'); render();
}
function restart(){ show('cover'); }

function render(){
  var text = ITEMS[idx][1];
  $('prog').style.width = (idx / ITEMS.length * 100) + '%';
  $('qno').textContent = '第 ' + (idx + 1) + ' / ' + ITEMS.length + ' 题';
  $('qtext').textContent = text;
  var box = $('opts'); box.innerHTML = '';
  LIK.forEach(function(label, val){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<b>' + label + '</b>';
    if (answers[idx] === val){ b.style.background = '#ffd60a'; b.style.borderColor = '#14161a'; }
    b.onclick = function(){ pick(val); };
    box.appendChild(b);
  });
  $('back').style.visibility = idx === 0 ? 'hidden' : 'visible';
}

function pick(val){
  answers[idx] = val;
  if (idx < ITEMS.length - 1){ idx++; render(); } else finish();
}
function prev(){ if (idx > 0){ idx--; render(); } }

var LEVELS = [[0,7,'偏轻'],[8,13,'中等'],[14,20,'偏重']];

function finish(){
  var score = {A:0,B:0,C:0,D:0};
  ITEMS.forEach(function(item, i){ score[item[0]] += answers[i]; });
  var ranked = ['A','B','C','D'].map(function(k){ return {k:k, v:score[k]}; })
                              .sort(function(a,b){ return b.v - a.v; });
  var main = ranked[0].k, second = ranked[1].k;
  var gap = ranked[0].v - ranked[1].v;
  var t = TYPES[main];
  var lv = '中等';
  for (var i = 0; i < LEVELS.length; i++){
    if (ranked[0].v >= LEVELS[i][0] && ranked[0].v <= LEVELS[i][1]) lv = LEVELS[i][2];
  }

  $('rname').textContent = t.name;
  $('rsub').textContent = t.sub;
  var MAXP = 24;
  $('rlevel').textContent = '内耗强度：' + lv + '（' + ranked[0].v + ' / ' + MAXP + '）';

  // 四维分布：让结果看起来是「你的」，不是模板
  var dimNames = {A:'回放', B:'预演', C:'对比', D:'归因'};
  var dimsHTML = ['A','B','C','D'].map(function(k){
    var pct = Math.round(score[k] / MAXP * 100);
    return '<div class="dim' + (k === main ? ' top1' : '') + '">' +
             '<div class="top"><div>' + dimNames[k] + ' · ' + TYPES[k].name + '</div>' +
             '<span>' + score[k] + ' / ' + MAXP + '</span></div>' +
             '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
           '</div>';
  }).join('');
  $('dims').innerHTML = dimsHTML;

  $('scenes').innerHTML = t.scenes.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  $('mechanism').textContent = t.mechanism;
  $('strength').textContent = t.strength;
  $('action').textContent = t.action;
  $('practice').innerHTML = t.practice.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  $('stopword').textContent = '「' + t.stop + '」';
  $('reply').textContent = t.reply;

  var showSecond = gap <= 3;
  $('second-block').classList.toggle('hide', !showSecond);
  if (showSecond){
    $('rsecond').textContent = '副型是「' + TYPES[second].name + '」——' + TYPES[second].sub;
    $('secondDetail').textContent = t.second + '（两型只差 ' + gap + ' 分，说明它们在你身上是同时在跑的。）';
  }

  lastResult = {main:main, second:second, gap:gap, score:score, level:lv, showSecond:showSecond};
  show('result');
  window.scrollTo(0, 0);
}

function share(){
  if (!lastResult) return;
  var t = TYPES[lastResult.main];
  var W = 1080, H = 1920;
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  g.fillStyle = '#f7f3e8'; g.fillRect(0, 0, W, H);

  g.fillStyle = '#8a8780'; g.font = '28px sans-serif';
  g.fillText('内耗类型测试 · 我的结果', 80, 110);

  g.fillStyle = '#14161a'; g.font = 'bold 92px sans-serif';
  g.fillText(t.name, 80, 230);
  var nw = g.measureText(t.name).width;
  g.fillStyle = '#ffd60a'; g.fillRect(80, 252, nw, 18);

  g.fillStyle = '#4a4740'; g.font = '34px sans-serif';
  var y = wrap(g, t.sub, 80, 330, W - 160, 50);

  g.fillStyle = '#8a8780'; g.font = '26px sans-serif';
  g.fillText('内耗强度：' + lastResult.level, 80, y + 16);

  /* 雷达图 */
  var cx = 540, cy = 700, R = 170;
  var keys = ['A','B','C','D'];
  var labels = ['回放','预演','对比','归因'];
  var ang = [-Math.PI/2, 0, Math.PI/2, Math.PI];
  function pt(i, r){ return [cx + Math.cos(ang[i]) * r, cy + Math.sin(ang[i]) * r]; }

  g.strokeStyle = '#e6e0d0'; g.lineWidth = 2;
  [0.5, 1].forEach(function(k){
    g.beginPath();
    for (var i = 0; i < 4; i++){
      var p = pt(i, R * k);
      if (i === 0) g.moveTo(p[0], p[1]); else g.lineTo(p[0], p[1]);
    }
    g.closePath(); g.stroke();
  });
  g.strokeStyle = '#e6e0d0';
  for (var i = 0; i < 4; i++){
    var e = pt(i, R);
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(e[0], e[1]); g.stroke();
  }

  g.beginPath();
  keys.forEach(function(k, i){
    var p = pt(i, R * (lastResult.score[k] / 24));
    if (i === 0) g.moveTo(p[0], p[1]); else g.lineTo(p[0], p[1]);
  });
  g.closePath();
  g.fillStyle = 'rgba(20,22,26,0.85)'; g.fill();
  g.strokeStyle = '#14161a'; g.lineWidth = 3; g.stroke();

  g.font = 'bold 30px sans-serif'; g.fillStyle = '#14161a';
  keys.forEach(function(k, i){
    var p = pt(i, R + 46);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(labels[i], p[0], p[1]);
  });
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

  /* 场景 */
  g.fillStyle = '#14161a'; g.font = 'bold 38px sans-serif';
  g.fillText('听起来像不像你', 80, 990);
  g.fillStyle = '#4a4740'; g.font = '30px sans-serif';
  y = 1050;
  t.scenes.slice(0, 4).forEach(function(s){ y = wrap(g, '· ' + s, 80, y, W - 160, 46) + 10; });

  /* 动作 */
  g.fillStyle = '#ffd60a'; g.fillRect(70, y + 40, W - 140, 190);
  g.fillStyle = '#6b5b00'; g.font = 'bold 28px sans-serif';
  g.fillText('今天就能做的一步', 100, y + 90);
  g.fillStyle = '#14161a'; g.font = '30px sans-serif';
  wrap(g, t.action, 100, y + 140, W - 200, 46);

  g.fillStyle = '#8a8780'; g.font = '24px sans-serif';
  g.fillText('自我觉察工具，不是诊断', 80, H - 60);

  var a = document.createElement('a');
  a.download = '内耗类型报告-' + t.name + '.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

function wrap(g, text, x, y, maxW, lh){
  var line = '';
  for (var i = 0; i < text.length; i++){
    var ch = text[i];
    if (g.measureText(line + ch).width > maxW){ g.fillText(line, x, y); y += lh; line = ch; }
    else line += ch;
  }
  if (line){ g.fillText(line, x, y); y += lh; }
  return y;
}
</script>
